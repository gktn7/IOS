name: reusable-docker-build
on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      dockerfile_path:
        required: true
        type: string      
      context_path:
        default: "."
        required: true
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker kurulumu
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: docker image build ve push
        run: |
          if docker buildx build --platform linux/amd64,linux/arm64 \
            -t ${{ secrets.DOCKER_USERNAME }}/${{ inputs.service_name }}:latest \
            -f ${{ inputs.dockerfile_path }} \
            ${{ inputs.context_path }} --push
            then
            echo "${{ inputs.service_name }} built and pushed successfully"
            else
            echo "${{ inputs.service_name }} built and pushed not successfully"
            fi

      
              
